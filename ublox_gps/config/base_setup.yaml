# Configuration Settings for ublox device
ublox_gps_node:
  ros__parameters:
    debug: 1                    # Range 0-4 (0 means no debug statements will print)

    save:
      mask: 3103                # Save I/O, Message, INF Message, Nav, Receiver
                                # Manager, Antenna, and Logging Configuration
      device: 3                 # Save to EEPROM

    device: /dev/ttyACM0
    frame_id: gps_base
    dynamic_model: stationary   # Velocity restricted to 0 m/s. Zero dynamics
                                # assumed.
    fix_mode: auto
    dr_limit: 0
    enable_ppp: false           # Not supported by C94-M8P

    rate: 4.0                   # Measurement rate in Hz
    nav_rate: 4                 # in number of measurement cycles

    # TMODE3 Config
    tmode3: 0                   # Survey-In Mode
    sv_in:
      reset: false              # True: disables and re-enables survey-in (resets)
                                # False: Disables survey-in only if TMODE3 is
                                # disabled
      min_dur: 300              # Survey-In Minimum Duration [s]
      acc_lim: 3.0              # Survey-In Accuracy Limit [m]

    dat:
      set: false

    # GNSS Config
    gnss:
      galileo: true
      glonass: true             # Supported by C94-M8P
      beidou: true             # Supported by C94-M8P
      qzss: false               # Supported by C94-M8P

    inf:
      all: true                   # Whether to display all INF messages in console

    # Enable u-blox message publishers
    publish:
      all: true
      aid:
        hui: false
      nav:
        posecef: false
      rxm:
        raw: true

    raw_data_stream:
      enable: true
      publish: true


raw_data_pa:
  ros__parameters:
    raw_data_stream:
      enable: true
      publish: false
      dir: "/workspace"